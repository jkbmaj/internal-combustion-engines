<style>
  :root { --bg:#101318; --panel:#1a1f27; --text:#d7dde6; --dim:#7b8494; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px;
  }
  h1 { font-size:18px; font-weight:600; margin:6px 0 2px; letter-spacing:.5px; }
  .sub { font-size:12px; color:var(--dim); margin-bottom:8px; }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--dim); margin-bottom:12px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:-1px; }
  canvas { background:var(--panel); border-radius:12px; max-width:100%; height:auto; }
  .row { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .engine { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .engine .cap { font-size:12px; color:var(--dim); letter-spacing:1px; }
  .controls {
    display:flex; align-items:center; gap:12px; margin-top:12px;
    font-size:13px; color:var(--dim);
  }
  input[type=range] { width:180px; accent-color:#e8863a; }
  button {
    background:#242b36; color:var(--text); border:1px solid #333c4a;
    border-radius:6px; padding:5px 14px; font-size:13px; cursor:pointer;

  .nav { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }

           border:1px solid #333c4a; padding:3px 10px; border-radius:6px; }
  .nav a:hover { color:var(--text); background:#242b36; }
  .nav a.cur { color:var(--text); border-color:#e8863a; }
</style>

<script>
'use strict';
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
const c2 = document.getElementById('c2'), g2 = c2.getContext('2d');
c2.style.width = '560px'; c2.style.height = '720px';
c2.width = Math.round(560 * DPR); c2.height = Math.round(720 * DPR);

const TAU = Math.PI * 2, PI = Math.PI;
const lerp = (a, b, t) => a + (b - a) * t;

/* ---- strokes & charge color ---- */
const STROKES = [
  { name: 'SSANIE',    color: '#4fa0ff' },
  { name: 'SPRĘŻANIE', color: '#7f8dff' },
  { name: 'PRACA',     color: '#ff8a2a' },
  { name: 'WYDECH',    color: '#9aa3ad' },
];
const strokeIndex = t => Math.floor(t / PI) % 4;

// blue intake -> densifying blue -> white/orange combustion -> grey exhaust
function gasStyle(t) {
  let r, g, b, a, f;
  if (t < PI) {
    f = t / PI;
    r = 80; g = 155; b = 255; a = 0.14 + 0.30 * f;
  } else if (t < 2 * PI) {
    f = (t - PI) / PI;
    r = lerp(80, 45, f); g = lerp(155, 110, f); b = lerp(255, 235, f);
    a = lerp(0.44, 0.78, f);
  } else if (t < 3 * PI) {
    f = (t - 2 * PI) / PI;
    if (f < 0.12) {
      const k = f / 0.12;
      r = 255; g = lerp(240, 145, k); b = lerp(190, 35, k); a = 0.92;
    } else {
      const k = (f - 0.12) / 0.88;
      r = lerp(255, 175, k); g = lerp(145, 125, k); b = lerp(35, 110, k);
      a = lerp(0.92, 0.6, k);
    }
  } else {
    f = (t - 3 * PI) / PI;
    r = lerp(165, 140, f); g = lerp(150, 145, f); b = lerp(140, 152, f);
    a = lerp(0.58, 0.14, f);
  }
  return `rgba(${r | 0},${g | 0},${b | 0},${a.toFixed(3)})`;
}

/* ---- per-cylinder phase chip ---- */
function strokeChip(g, x, y, w, h, ph, label) {
  const st = STROKES[strokeIndex(ph)];
  g.font = '600 12px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.beginPath(); g.roundRect(x, y, w, h, 6);
  g.fillStyle = '#242b36'; g.fill();
  g.save();
  g.beginPath(); g.roundRect(x, y, w * ((ph % PI) / PI), h, 6); g.clip();
  g.globalAlpha = 0.45; g.fillStyle = st.color; g.fillRect(x, y, w, h);
  g.restore(); g.globalAlpha = 1;
  g.strokeStyle = st.color; g.lineWidth = 2;
  g.beginPath(); g.roundRect(x, y, w, h, 6); g.stroke();
  g.fillStyle = '#d7dde6';
  g.fillText(label + ' · ' + st.name[0] + st.name.slice(1, 3).toLowerCase(), x + w / 2, y + h / 2 + 1);
}

/* ---- shared cylinder geometry ---- */
const GEO = { R: 32, L: 104, BHW: 24, WALL: 8, PH: 28, CO: 15 };
const DECK = GEO.R + GEO.L + 22;          // crank center -> deck, along bore axis
const LINER = 2 * GEO.R + GEO.PH + 22;    // liner length below deck

// slider-crank: wrist-pin distance from crank center (TDC at ph = 0 mod 2π)
function slider(ph) {
  const s = GEO.R * Math.sin(ph);
  return GEO.R * Math.cos(ph) + Math.sqrt(GEO.L * GEO.L - s * s);
}

/* ---- timing drive: chain + sprockets ---- */
function chain(g, pts, crank) {
  g.lineJoin = 'round';
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  g.strokeStyle = '#2a313c'; g.lineWidth = 6; g.stroke();
  g.strokeStyle = '#4d5866'; g.lineWidth = 2; g.stroke();
  const segs = []; let tot = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    segs.push([a, b, l]); tot += l;
  }
  // link speed tied to crank angle; 168/(4pi) px/rad keeps the 720-degree loop seamless
  const spacing = 14, off = (spacing - (crank * (168 / (4 * PI))) % spacing) % spacing; // clockwise, like crank & cams
  g.fillStyle = '#98a2b0';
  for (let d = off; d < tot; d += spacing) {
    let r = d;
    for (const [a, b, l] of segs) {
      if (r <= l) {
        const u = r / l;
        g.beginPath();
        g.arc(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, 1.7, 0, TAU);
        g.fill();
        break;
      }
      r -= l;
    }
  }
}

function sprocket(g, x, y, r, ang) {
  g.beginPath(); g.arc(x, y, r, 0, TAU);
  g.fillStyle = '#39424f'; g.fill();
  g.strokeStyle = '#5b6675'; g.lineWidth = 2; g.stroke();
  g.beginPath(); g.arc(x + Math.cos(ang) * (r - 4), y + Math.sin(ang) * (r - 4), 2, 0, TAU);
  g.fillStyle = '#20262f'; g.fill();
  g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fillStyle = '#20262f'; g.fill();
}

// one cylinder slice seen along the crank axis; bore axis tilted phi from vertical
function drawCyl(g, bx, by, phi, ph, shade, front) {
  g.save();
  if (shade < 1) g.filter = `brightness(${shade})`;
  g.translate(bx, by);

  // crank end-on: dashed pin orbit, shaded journal, web + shaped counterweight
  g.setLineDash([4, 4]);
  g.strokeStyle = 'rgba(122,132,148,0.35)'; g.lineWidth = 1.2;
  g.beginPath(); g.arc(0, 0, GEO.R, 0, TAU); g.stroke();
  g.setLineDash([]);
  if (front) {
    const beta = Math.atan2(-Math.cos(ph), Math.sin(ph)); // pin angle from +x
    const cw = g.createRadialGradient(0, 0, 6, 0, 0, 44);
    cw.addColorStop(0, '#4a5463'); cw.addColorStop(1, '#313944');
    g.fillStyle = cw;
    g.beginPath();                                        // counterweight lobe
    g.arc(0, 0, 42, beta + PI - 0.95, beta + PI + 0.95);
    g.arc(0, 0, 15, beta + PI + 1.35, beta + PI - 1.35, true);
    g.closePath(); g.fill();
    g.strokeStyle = '#242b35'; g.lineWidth = 1.5; g.stroke();
    g.beginPath();                                        // crank web toward pin
    g.arc(0, 0, 26, beta - 0.5, beta + 0.5);
    g.lineTo(0, 0); g.closePath();
    g.fillStyle = '#3a4351'; g.fill();
  }
  const mj = g.createRadialGradient(-3, -3, 1, 0, 0, 10);
  mj.addColorStop(0, '#5b6675'); mj.addColorStop(1, '#39424f');
  g.beginPath(); g.arc(0, 0, 9, 0, TAU);
  g.fillStyle = mj; g.fill();
  g.strokeStyle = '#4d5866'; g.lineWidth = 2; g.stroke();
  g.beginPath(); g.arc(0, 0, 3, 0, TAU); g.fillStyle = '#20262f'; g.fill();

  g.rotate(phi);                            // bore axis is local -y
  const top = -DECK;
  const OW = GEO.BHW + GEO.WALL;
  const mg = g.createLinearGradient(-OW, 0, OW, 0);   // cast-metal shading
  mg.addColorStop(0, '#525e6f'); mg.addColorStop(0.12, '#3c4552');
  mg.addColorStop(0.88, '#3c4552'); mg.addColorStop(1, '#2c333e');
  g.fillStyle = mg;
  g.beginPath(); g.roundRect(-OW, top - 22, OW * 2, 22, [5, 5, 0, 0]); g.fill(); // head
  g.fillRect(-OW, top, GEO.WALL, LINER);              // cylinder walls
  g.fillRect(GEO.BHW, top, GEO.WALL, LINER);
  g.fillStyle = '#232a34';                            // head gasket line
  g.fillRect(-OW, top - 2, OW * 2, 2);
  g.fillStyle = '#2c333e';                            // head bolts
  for (const hx of [-OW + 5, OW - 5]) { g.beginPath(); g.arc(hx, top - 17, 2.2, 0, TAU); g.fill(); }
  g.fillStyle = '#333b47';                            // cooling fins
  for (let fy = top + 12; fy < top + 72; fy += 12) {
    g.fillRect(-OW - 4, fy, 4, 3); g.fillRect(OW, fy, 4, 3);
  }
  const bg = g.createLinearGradient(-GEO.BHW, 0, GEO.BHW, 0); // honed bore sheen
  bg.addColorStop(0, '#20262f'); bg.addColorStop(0.25, '#141920');
  bg.addColorStop(1, '#10141a');
  g.fillStyle = bg;
  g.fillRect(-GEO.BHW, top, GEO.BHW * 2, LINER);

  const s = slider(ph);
  const crown = -s - GEO.CO;
  g.fillStyle = gasStyle(ph);               // charge, color-coded by stroke
  g.fillRect(-GEO.BHW, top, GEO.BHW * 2, crown - top);
  if (ph >= 2 * PI && ph < 2 * PI + 0.4) {  // ignition flash
    const gl = g.createRadialGradient(0, top + 12, 2, 0, top + 12, 55);
    gl.addColorStop(0, 'rgba(255,235,150,0.85)');
    gl.addColorStop(1, 'rgba(255,120,20,0)');
    g.fillStyle = gl;
    g.fillRect(-GEO.BHW, top, GEO.BHW * 2, crown - top);
  }
  // --- head detail: ports, valves, spark plug, mixture flow ---
  const inLift = ph < PI ? 8 * Math.sin(ph) : 0;                 // intake valve
  const exLift = ph >= 3 * PI ? 8 * Math.sin(ph - 3 * PI) : 0;   // exhaust valve
  g.fillStyle = '#242b36';                                       // cam carrier / cover
  g.beginPath(); g.roundRect(-26, top - 46, 52, 26, 6); g.fill();
  g.strokeStyle = '#2c333e'; g.lineWidth = 1.5; g.stroke();
  const IN_PIPE = [[-46, top - 28], [-20, top - 14], [-11, top - 6]];
  const EX_PIPE = [[11, top - 6], [20, top - 14], [46, top - 28]];
  for (const [pts, tint] of [[IN_PIPE, inLift > 0.5 ? 'rgba(80,155,255,0.35)' : null],
                             [EX_PIPE, exLift > 0.5 ? 'rgba(160,162,168,0.4)' : null]]) {
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
    g.strokeStyle = '#39424f'; g.lineWidth = 13; g.stroke();
    g.strokeStyle = '#161b23'; g.lineWidth = 8; g.stroke();
    if (tint) { g.strokeStyle = tint; g.stroke(); }
  }
  for (const [vx, lift, col] of [[-11, inLift, '#c3cbd6'], [11, exLift, '#98a2b0']]) {
    if (lift > 0.5) { g.fillStyle = '#10141a'; g.fillRect(vx - 8, top - 2, 16, lift + 2); }
    g.fillStyle = '#20262f';                                     // valve guide
    g.fillRect(vx - 3, top - 20, 6, 6);
    g.strokeStyle = '#7f8a99'; g.lineWidth = 1.3;                // spring (compresses on lift)
    g.beginPath();
    const sy0 = top - 18 + lift, sy1 = top - 4;
    g.moveTo(vx, sy0);
    for (let z = 1; z <= 6; z++) g.lineTo(vx + (z % 2 ? 5 : -5), sy0 + (sy1 - sy0) * z / 6);
    g.stroke();
    g.fillStyle = col;
    g.fillRect(vx - 1.5, top - 18 + lift, 3, 16);                // stem
    g.beginPath();                                               // poppet with 45° seat
    g.moveTo(vx - 8, top + lift - 2); g.lineTo(vx + 8, top + lift - 2);
    g.lineTo(vx + 6, top + lift + 2); g.lineTo(vx - 6, top + lift + 2);
    g.closePath(); g.fill();
    g.strokeStyle = '#111'; g.lineWidth = 1; g.stroke();
  }
  // DOHC: cam lobes turn at half crank speed, pressing the bucket tappets
  for (const [vx, lam, lift] of [[-11, ph / 2 + PI / 4, inLift],
                                 [11, ph / 2 - 1.25 * PI, exLift]]) {
    g.fillStyle = '#39424f';                                     // bucket tappet
    g.fillRect(vx - 5, top - 22 + lift, 10, 4);
    const ccx = vx, ccy = top - 31;
    g.fillStyle = '#5b6675';
    g.beginPath(); g.arc(ccx, ccy, 5.5, 0, TAU); g.fill();       // base circle
    g.beginPath();                                               // lobe
    g.moveTo(ccx + Math.cos(lam + 1.1) * 5, ccy + Math.sin(lam + 1.1) * 5);
    g.quadraticCurveTo(ccx + Math.cos(lam) * 13, ccy + Math.sin(lam) * 13,
                       ccx + Math.cos(lam - 1.1) * 5, ccy + Math.sin(lam - 1.1) * 5);
    g.closePath(); g.fill();
    g.beginPath(); g.arc(ccx, ccy, 2, 0, TAU); g.fillStyle = '#20262f'; g.fill();
  }
  // GDI: side-mounted direct injector, spraying while the intake valve is open
  g.save();
  g.translate(-17, top + 3); g.rotate(0.7);
  g.fillStyle = '#9aa5b3'; g.fillRect(-2.5, -18, 5, 15);         // injector body
  g.fillStyle = '#7f8a99'; g.fillRect(-4.5, -20, 9, 5);          // clamp
  g.beginPath(); g.moveTo(-2, -3); g.lineTo(2, -3); g.lineTo(0, 3); g.closePath();
  g.fillStyle = '#cfd6df'; g.fill();                             // nozzle
  if (inLift > 2) {
    g.strokeStyle = '#ffb347'; g.lineWidth = 1.4; g.globalAlpha = 0.9;
    for (let k = 0; k < 4; k++) {
      const a3 = (k - 1.5) * 0.28;
      g.beginPath(); g.moveTo(0, 3);
      g.lineTo(Math.sin(a3) * 14, 3 + Math.cos(a3) * 13);
      g.stroke();
    }
    g.fillStyle = '#ffb347';
    for (let k = 0; k < 3; k++) {
      const u3 = (ph / PI + k / 3) % 1;
      g.beginPath(); g.arc((k - 1) * 4 * u3, 4 + 14 * u3, 1.4, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }
  g.restore();
  g.fillStyle = '#cfd6df'; g.fillRect(-2.5, top - 30, 5, 14);    // plug insulator
  g.fillStyle = '#8a94a3'; g.fillRect(-4.5, top - 17, 9, 9);     // plug hex
  g.fillStyle = '#cfd6df'; g.fillRect(-1, top - 8, 2, 8);        // electrode
  if (ph >= 2 * PI - 0.22 && ph < 2 * PI + 0.12) {               // spark just before TDC
    const gl2 = g.createRadialGradient(0, top + 4, 1, 0, top + 4, 16);
    gl2.addColorStop(0, 'rgba(255,244,200,0.95)');
    gl2.addColorStop(0.4, 'rgba(255,220,120,0.55)');
    gl2.addColorStop(1, 'rgba(255,180,60,0)');
    g.fillStyle = gl2;
    g.beginPath(); g.arc(0, top + 4, 16, 0, TAU); g.fill();
    const jit = Math.sin(ph * 90);
    g.strokeStyle = '#fff2b0'; g.lineWidth = 2; g.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      const a2 = PI / 2 + (k - 1.5) * 0.55 + jit * 0.15;
      g.beginPath(); g.moveTo(0, top);
      g.lineTo(Math.cos(a2) * 6, top + Math.sin(a2) * 6);
      g.lineTo(Math.cos(a2) * 11 + jit * 2, top + Math.sin(a2) * 11);
      g.stroke();
    }
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(0, top + 1, 2, 0, TAU); g.fill();
  }
  // fuel-air mixture in (blue air + amber fuel droplets), exhaust gas out
  const plerp = (pts, u) => {
    const n = pts.length - 1, x = Math.min(u, 0.999) * n, i = x | 0, f = x - i;
    return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
            pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
  };
  if (inLift > 0.5) {
    const f = ph / PI;
    const path = [[-46, top - 28], [-20, top - 14], [-11, top - 2], [-6, top + 22]];
    for (let k = 0; k < 6; k++) {
      const u = (f * 2 + k / 6) % 1;
      const [px, py] = plerp(path, u);
      const fuel = false;            // GDI: fuel is injected directly
      g.globalAlpha = Math.sin(u * PI) * 0.9;
      g.fillStyle = fuel ? '#ffb347' : '#8ec4ff';
      g.beginPath(); g.arc(px, py, fuel ? 2 : 2.5, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }
  if (exLift > 0.5) {
    const f = (ph - 3 * PI) / PI;
    const path = [[6, top + 22], [11, top - 2], [20, top - 14], [46, top - 28]];
    for (let k = 0; k < 6; k++) {
      const u = (f * 2 + k / 6) % 1;
      const [px, py] = plerp(path, u);
      g.globalAlpha = Math.sin(u * PI) * 0.85;
      g.fillStyle = '#c2c8cf';
      g.beginPath(); g.arc(px, py, 2.5, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }

  // tapered connecting rod with big-end cap, then piston over it
  const jx = GEO.R * Math.sin(ph), jy = -GEO.R * Math.cos(ph);
  {
    const dx = jx, dy = jy + s, len = Math.hypot(dx, dy);
    const nx = -dy / len, ny = dx / len;                  // rod normal
    const rg = g.createLinearGradient(0, -s, jx, jy);
    rg.addColorStop(0, '#aeb8c6'); rg.addColorStop(1, '#78828f');
    g.fillStyle = rg;
    g.beginPath();
    g.moveTo(nx * 4.5, -s + ny * 4.5);
    g.lineTo(jx + nx * 8, jy + ny * 8);
    g.lineTo(jx - nx * 8, jy - ny * 8);
    g.lineTo(-nx * 4.5, -s - ny * 4.5);
    g.closePath(); g.fill();
    g.strokeStyle = '#39424f'; g.lineWidth = 1; g.stroke();
    g.beginPath(); g.arc(jx, jy, 10, 0, TAU);             // big-end cap
    g.fillStyle = '#6b7583'; g.fill();
    g.strokeStyle = '#39424f'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = '#2c333e';                              // cap bolts
    for (const sgn of [1, -1]) {
      g.beginPath(); g.arc(jx + nx * 6.5 * sgn, jy + ny * 6.5 * sgn, 1.6, 0, TAU); g.fill();
    }
  }
  const pg = g.createLinearGradient(-GEO.BHW, 0, GEO.BHW, 0);
  pg.addColorStop(0, '#828d9c'); pg.addColorStop(0.35, '#cdd5e0');
  pg.addColorStop(0.65, '#b4bdc9'); pg.addColorStop(1, '#79828f');
  g.fillStyle = pg;
  g.beginPath(); g.roundRect(-GEO.BHW + 1, crown, GEO.BHW * 2 - 2, GEO.PH, [1, 1, 5, 5]); g.fill();
  g.strokeStyle = 'rgba(224,230,238,0.7)'; g.lineWidth = 1;   // crown highlight
  g.beginPath(); g.moveTo(-GEO.BHW + 3, crown + 1.5); g.lineTo(GEO.BHW - 3, crown + 1.5); g.stroke();
  g.strokeStyle = '#39424f'; g.lineWidth = 1.6;               // compression rings
  for (const ry of [crown + 5, crown + 9]) {
    g.beginPath(); g.moveTo(-GEO.BHW + 1, ry); g.lineTo(GEO.BHW - 1, ry); g.stroke();
  }
  g.strokeStyle = '#4a5461'; g.lineWidth = 1;                 // oil-control ring pair
  for (const ry of [crown + 13, crown + 15]) {
    g.beginPath(); g.moveTo(-GEO.BHW + 1, ry); g.lineTo(GEO.BHW - 1, ry); g.stroke();
  }
  g.beginPath(); g.arc(0, -s, 6.5, 0, TAU);                   // wrist pin
  g.fillStyle = '#6b7583'; g.fill();
  g.strokeStyle = '#39424f'; g.lineWidth = 1.5; g.stroke();
  g.beginPath(); g.arc(0, -s, 2.8, 0, TAU);
  g.fillStyle = '#2c333e'; g.fill();
  g.restore();
}

/* ---- V6 (canvas 2) ----
   Same camera: each crank throw carries a pair of cylinders at ±30°; throws
   stack up the screen. Even i = right bank, odd = left; fires every 120°. */
const V6 = { CX: 280, BASE: 620, DX: 0, DY: 115, BANK: PI / 6 };
const v6Phase = (t, i) => (((t - i * 2 * PI / 3) % (4 * PI)) + 4 * PI) % (4 * PI);

function renderV6(t) {
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  g2.clearRect(0, 0, 560, 720);
  g2.fillStyle = '#1e242e';                // block backdrop
  g2.beginPath(); g2.roundRect(V6.CX - 155, 192, 310, 476, 18); g2.fill();
  for (let d = 2; d >= 0; d--) {
    const bx = V6.CX + d * V6.DX, by = V6.BASE - d * V6.DY;
    for (const side of [0, 1]) {
      const i = d * 2 + side;
      const phi = side === 0 ? V6.BANK : -V6.BANK;
      drawCyl(g2, bx, by, phi, v6Phase(t, i), 1 - d * 0.12, d === 0 && side === 0);
    }
  }
  // timing chain in the front-cover plane: crank sprocket up to both banks' cams
  {
    const camL = DECK + 31;
    const rp = (x, y, a) => [V6.CX + x * Math.cos(a) - y * Math.sin(a),
                             V6.BASE + x * Math.sin(a) + y * Math.cos(a)];
    const pts = [[V6.CX + 15, V6.BASE + 4],
                 rp(13, -camL, V6.BANK), rp(-11, -camL, V6.BANK),
                 rp(11, -camL, -V6.BANK), rp(-13, -camL, -V6.BANK),
                 [V6.CX - 15, V6.BASE + 4]];
    chain(g2, pts, t);
    sprocket(g2, V6.CX, V6.BASE, 13, t);
    sprocket(g2, ...rp(13, -camL, V6.BANK), 7, t / 2);
    sprocket(g2, ...rp(-13, -camL, -V6.BANK), 7, t / 2);
  }
  const w = 80, gap = 6, x0 = 280 - (w * 6 + gap * 5) / 2;
  for (let i = 0; i < 6; i++)
    strokeChip(g2, x0 + i * (w + gap), 24, w, 30, v6Phase(t, i), 'C' + (i + 1));
}


const OCFG = {
  g: g2, cycle: 4 * PI, twoStroke: false,
  pulses: [0, 2 * PI / 3, 4 * PI / 3, 2 * PI, 8 * PI / 3, 10 * PI / 3], amp: 0.06, powerWin: [2 * PI, 3 * PI],
  hudY: 70, graph: [180, 670, 200, 44], graphLabel: 'p(θ) — cylinder 1',
  marker: t => t % OCFG.cycle,
  turbo: null,
  labels: [
    [372, 461, 444, 428, 'Świeca zapłonowa'],
    [333, 436, 444, 396, 'Kanał dolotowy'],
    [413, 482, 448, 470, 'Kanał wydechowy'],
    [296, 545, 444, 578, 'Łańcuch rozrządu'],
    [280, 620, 444, 636, 'Wał korbowy'],
  ],
};

/* ---- educational overlay: HUD, part labels, pressure graph, torque pulses ---- */
function torqueMul(t) {
  let m = 1;
  for (const o of OCFG.pulses) {
    const ph = ((t - o) % OCFG.cycle + OCFG.cycle) % OCFG.cycle;
    if (ph >= OCFG.powerWin[0] && ph < OCFG.powerWin[1])
      m += OCFG.amp * Math.sin((ph - OCFG.powerWin[0]) / (OCFG.powerWin[1] - OCFG.powerWin[0]) * PI);
  }
  return m;
}
function pCurve(th) {
  if (!OCFG.twoStroke) {
    if (th < PI) return 0.05;
    if (th < 2 * PI) { const f = (th - PI) / PI; return 0.05 + 0.30 * Math.pow(f, 2.2); }
    if (th < 3 * PI) { const f = (th - 2 * PI) / PI; return 0.08 + 0.92 * Math.exp(-2.6 * f); }
    return 0.09;
  }
  if (th < 2.1) return 0.08 + 0.92 * Math.exp(-1.8 * th / 2.1);
  if (th < PI + 0.8) return 0.12;
  if (th < 4.0) return 0.10;
  return 0.10 + 0.25 * Math.pow((th - 4.0) / (TAU - 4.0), 2.2);
}
function drawTurbo(g2, x, y, t) {
  const spin = t * 6;
  g2.font = '600 10px system-ui'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
  for (const [dx2, col, lab] of [[-26, '#a08055', 'TURBINA'], [26, '#5a86ad', 'SPRĘŻARKA']]) {
    g2.beginPath(); g2.arc(x + dx2, y, 20, 0, TAU);
    g2.fillStyle = '#242b36'; g2.fill();
    g2.strokeStyle = col; g2.lineWidth = 2.5; g2.stroke();
    g2.strokeStyle = col; g2.lineWidth = 2;
    for (let k = 0; k < 6; k++) {
      const a = spin + k * PI / 3;
      g2.beginPath(); g2.moveTo(x + dx2, y);
      g2.lineTo(x + dx2 + Math.cos(a) * 15, y + Math.sin(a) * 15);
      g2.stroke();
    }
    g2.fillStyle = '#7b8494'; g2.fillText(lab, x + dx2, y + 33);
  }
  g2.fillStyle = '#5b6675'; g2.fillRect(x - 7, y - 3, 14, 6);
  g2.strokeStyle = '#9aa3ad'; g2.lineWidth = 4;
  g2.beginPath(); g2.moveTo(x - 26, y - 36); g2.lineTo(x - 26, y - 21); g2.stroke();
  g2.strokeStyle = '#4fa0ff';
  g2.beginPath(); g2.moveTo(x + 26, y - 36); g2.lineTo(x + 26, y - 21); g2.stroke();
  g2.textAlign = 'left';
}
window.showLabels = false;
function overlay(t) {
  const g2 = OCFG.g, ph = OCFG.marker(t);
  g2.font = '600 12px system-ui'; g2.textAlign = 'left'; g2.textBaseline = 'middle';
  g2.fillStyle = '#7b8494';
  g2.fillText('kąt wału: ' + Math.round((t % OCFG.cycle) * 180 / PI) + '° / '
              + Math.round(OCFG.cycle * 180 / PI) + '°', 12, OCFG.hudY);
  const [gx, gy, gw, gh] = OCFG.graph;
  g2.strokeStyle = '#333c4a'; g2.lineWidth = 1; g2.strokeRect(gx, gy, gw, gh);
  g2.beginPath();
  for (let i = 0; i <= 120; i++) {
    const x = gx + gw * i / 120, y = gy + gh - 4 - (gh - 10) * pCurve(OCFG.cycle * i / 120);
    i ? g2.lineTo(x, y) : g2.moveTo(x, y);
  }
  g2.strokeStyle = '#e8863a'; g2.lineWidth = 1.5; g2.stroke();
  g2.beginPath();
  g2.arc(gx + gw * (ph / OCFG.cycle), gy + gh - 4 - (gh - 10) * pCurve(ph), 3, 0, TAU);
  g2.fillStyle = '#ffe98a'; g2.fill();
  g2.fillStyle = '#7b8494'; g2.font = '11px system-ui';
  g2.fillText(OCFG.graphLabel, gx + 4, gy - 8);
  if (window.showLabels) {
    g2.font = '11px system-ui';
    for (const [ax, ay, tx, ty, txt] of OCFG.labels) {
      g2.strokeStyle = 'rgba(215,221,230,0.45)'; g2.lineWidth = 1;
      g2.beginPath(); g2.moveTo(ax, ay); g2.lineTo(tx, ty); g2.stroke();
      const tw = g2.measureText(txt).width;
      g2.fillStyle = 'rgba(16,19,24,0.75)';
      g2.fillRect(tx + 1, ty - 8, tw + 6, 16);
      g2.fillStyle = '#d7dde6'; g2.fillText(txt, tx + 4, ty);
      g2.beginPath(); g2.arc(ax, ay, 2, 0, TAU);
      g2.fillStyle = '#d7dde6'; g2.fill();
    }
  }
  if (OCFG.turbo) drawTurbo(g2, OCFG.turbo[0], OCFG.turbo[1], t);
}

/* ---- main loop ---- */
const speedEl = document.getElementById('speed');
const rpmEl = document.getElementById('rpm');
const pauseBtn = document.getElementById('pause');
let paused = false;
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? 'Wznów' : 'Pauza'; };
document.getElementById('step').onclick = () => {
  paused = true; pauseBtn.textContent = 'Wznów';
  t = (t + PI / 12) % OCFG.cycle;
};
document.getElementById('labels').onclick = () => { window.showLabels = !window.showLabels; };

const BASE_OMEGA = 4 * PI / 6;   // one full 720-degree cycle per 6 s at speed 1
let t = 0, last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const speed = parseFloat(speedEl.value);
  if (!paused) t = (t + BASE_OMEGA * torqueMul(t) * speed * dt) % (4 * PI);
  rpmEl.textContent = `${Math.round(BASE_OMEGA * speed / TAU * 60)} obr/min (poglądowo)`;
  renderV6(t);
  overlay(t);
  if (!suspended) rafId = requestAnimationFrame(frame);
}
let suspended = false, rafId = requestAnimationFrame(frame);

// stop the render loop entirely while the window/tab is unfocused
function suspend() {
  if (!suspended) { suspended = true; cancelAnimationFrame(rafId); }
}
function resume() {
  if (suspended) { suspended = false; last = performance.now(); rafId = requestAnimationFrame(frame); }
}
window.addEventListener('blur', suspend);
window.addEventListener('focus', resume);
document.addEventListener('visibilitychange', () => document.hidden ? suspend() : resume());
</script>
